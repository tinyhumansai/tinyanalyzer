[package]
name = "tinyanalyzer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The analysis engine behind tinyanalyzer: source metrics, Rust item and complexity analysis, dependency graphs, dead-code detection, and performance findings."
documentation = "https://docs.rs/tinyanalyzer-core"
readme = "README.md"
keywords = ["analysis", "metrics", "static-analysis", "dead-code", "dependencies"]
categories = ["development-tools"]
publish = false

# Deliberately server-free: this is the crate another tool embeds to analyze a
# repository, so it must cost that tool nothing at runtime. Nothing here may
# pull in an HTTP server, a web framework, or an async runtime — the dashboard
# lives one crate up. CI asserts it.
[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
cargo_metadata = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
