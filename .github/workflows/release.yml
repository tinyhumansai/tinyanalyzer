name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The workspace member that ships as the executable. Its package name is the
  # binary name and the artifact name; `crates/tinyanalyzer-core` rides along on
  # the same inherited version and is not released separately.
  RELEASE_PACKAGE: tinyanalyzer

jobs:
  prepare:
    name: Prepare release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.version.outputs.crate_name }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 target/coverage.json

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .name' <<< "$metadata")"
          current_version="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .version' <<< "$metadata")"
          if [[ -z "$crate_name" || "$crate_name" == "null" ]]; then
            echo "Could not resolve the crate name" >&2
            exit 1
          fi
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            current)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [[ "${{ inputs.bump }}" != "current" ]]; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
            tagged_version="$(
              git show "${tag}:Cargo.toml" \
                | sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' \
                | head -n 1
            )"
            if [[ "$tagged_version" != "$current_version" ]]; then
              echo "Tag ${tag} does not contain version ${current_version}" >&2
              exit 1
            fi
          elif [[ "${{ inputs.bump }}" == "current" ]]; then
            echo "Tag ${tag} does not exist; choose a semantic version bump" >&2
            exit 1
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        if: ${{ inputs.bump != 'current' }}
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          # One version for the whole workspace: every member inherits it with
          # `version.workspace = true`, so this is the only edit needed.
          perl -0pi -e 's/(\[workspace\.package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          # `--workspace` re-resolves the local packages only, which is what a
          # version bump changes. `-p <name> --precise` cannot express "and the
          # other member moved too".
          cargo update --workspace
          released="$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg name "$CRATE_NAME" \
              '.packages[] | select(.name == $name) | .version')"
          if [[ "$released" != "$NEXT_VERSION" ]]; then
            echo "version bump did not take: expected ${NEXT_VERSION}, got ${released}" >&2
            exit 1
          fi

      - name: Commit version bump and tag
        if: ${{ inputs.bump != 'current' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

  binaries:
    name: Binary (${{ matrix.id }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - id: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - id: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - id: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the release commit the prepare job pushed, not the branch
          # head, so a push landing mid-release cannot be built under this tag.
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the release binary
        run: >
          cargo build --locked --release
          --package ${{ env.RELEASE_PACKAGE }}
          --bin ${{ env.RELEASE_PACKAGE }}
          --target ${{ matrix.target }}

      # A binary that builds and then refuses to start is the failure this
      # release exists to prevent, so it is run before it is packaged. `--help`
      # exercises argument parsing without touching a repository; the analysis
      # itself is covered by the test suite the prepare job ran.
      - name: Verify the binary starts
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${RELEASE_PACKAGE}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
          "$binary" --help > /dev/null

      - name: Package the binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          name="${RELEASE_PACKAGE}-${RELEASE_TAG}-${{ matrix.id }}"
          staging="dist/${name}"
          mkdir -p "$staging"

          binary="target/${{ matrix.target }}/release/${RELEASE_PACKAGE}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "${binary}.exe" "$staging/"
          else
            cp "$binary" "$staging/"
          fi
          cp README.md LICENSE "$staging/"

          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${name}.zip" "$name" > /dev/null
          else
            tar -czf "${name}.tar.gz" "$name"
          fi

      - name: Upload the package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.RELEASE_PACKAGE }}-${{ matrix.id }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs:
      - prepare
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      # Checksums are what lets somebody verify a download they did not watch
      # being built, and the one file that has to be produced after every other
      # artifact exists.
      - name: Checksum every package
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
